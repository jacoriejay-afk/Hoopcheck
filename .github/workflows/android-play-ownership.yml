name: Android Play purchase ownership rehearsal (synthetic)
on:
  pull_request:
    branches: ["qa/hoopcheck-master-acceptance", "integration/build17-development"]
    paths:
      - "supabase/candidates/android_play_purchase_ledger.sql"
      - "supabase/tests/android_play_purchase_ledger_fixture.sql"
      - "supabase/candidates/android_play_lifecycle.sql"
      - "supabase/tests/android_play_lifecycle_fixture.sql"
      - "supabase/candidates/android_play_intent_fulfillment.sql"
      - "supabase/tests/android_play_intent_fulfillment_fixture.sql"
      - "supabase/candidates/android_play_notification_queue.sql"
      - "supabase/tests/android_play_notification_queue_fixture.sql"
      - ".github/workflows/android-play-ownership.yml"
permissions:
  contents: read
jobs:
  isolated-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable ownership and privilege isolation using synthetic PG17
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin;"
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/candidates/android_play_purchase_ledger.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/android_play_purchase_ledger_fixture.sql
          # Race two owners for an unused fingerprint; unique index must allow only one.
          claim() {
            docker exec -i "$PG_CONTAINER" psql -U postgres -qAt -v ON_ERROR_STOP=1 -c "set role service_role; select play_billing_candidate.claim_test_purchase(repeat('e',64),'$1'::uuid,1::smallint,'v1.'||repeat('A',16)||'.'||repeat('B',22)||'.'||repeat('C',22),'hoopcheck.pro','monthly');"
          }
          claim '11111111-1111-4111-8111-111111111111' > /tmp/play-owner-a & a=$!
          claim '22222222-2222-4222-8222-222222222222' > /tmp/play-owner-b & b=$!
          wait "$a"; wait "$b"
          result="$(cat /tmp/play-owner-a /tmp/play-owner-b | sort)"
          test "$result" = "$(printf 'claimed\nforeign_owner')"
          echo "Concurrent synthetic claim isolation passed"
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/candidates/android_play_lifecycle.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/android_play_lifecycle_fixture.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/candidates/android_play_intent_fulfillment.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/android_play_intent_fulfillment_fixture.sql
          # Race two consumers of the same verified synthetic intent.
          intent="$(docker exec -i "$PG_CONTAINER" psql -U postgres -qAt -v ON_ERROR_STOP=1 -c "set role service_role; select play_billing_candidate.issue_test_intent('44444444-4444-4444-8444-444444444444','33333333-3333-4333-8333-333333333333',repeat('c',64),'hoopcheck.pro','monthly','4990000','USD');")"
          [[ "$intent" =~ ^[0-9a-f-]{36}$ ]]
          consume() {
            docker exec -i "$PG_CONTAINER" psql -U postgres -qAt -v ON_ERROR_STOP=1 -c "set role service_role; select play_billing_candidate.consume_test_intent('$intent','44444444-4444-4444-8444-444444444444','33333333-3333-4333-8333-333333333333',repeat('c',64),'hoopcheck.pro','monthly','4990000','USD');"
          }
          consume > /tmp/play-consume-a & a=$!
          consume > /tmp/play-consume-b & b=$!
          wait "$a"; wait "$b"
          test "$(cat /tmp/play-consume-a /tmp/play-consume-b | sort)" = "$(printf 'f\nt')"
          echo "Concurrent single-use intent consumption passed"
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/candidates/android_play_notification_queue.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/android_play_notification_queue_fixture.sql
