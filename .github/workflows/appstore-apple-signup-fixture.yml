name: App Store Apple signup rehearsal (synthetic)
on:
  pull_request:
    branches: ["integration/appstore-compliance-candidate"]
    paths:
      - "supabase/candidates/appstore_apple_pending_signup.sql"
      - "supabase/tests/appstore_apple_pending_signup_fixture.sql"
      - "supabase/migrations/20261110135216_google_signup_onboarding.sql"
      - ".github/workflows/appstore-apple-signup-fixture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoopcheck_apple_signup_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoopcheck_apple_signup_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hoopcheck_apple_signup_fixture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify local fixture database and run SQL
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "hoopcheck_apple_signup_fixture"
          psql -X -Atqc 'SHOW server_version_num' | grep '^17'
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appstore_apple_pending_signup_fixture.sql
          echo "Synthetic SQL only; no real provider authentication, hosted database or deployment."
