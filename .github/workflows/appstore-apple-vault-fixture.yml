name: Apple authorization vault rehearsal (synthetic)
on:
  pull_request:
    branches: ["fix/appstore-native-social-onboarding","integration/appstore-compliance-candidate", "qa/post16-reconcile-repair-compliance", "integration/post16-release-reconciliation", "qa/hoopcheck-master-acceptance", "integration/build17-development"]
    paths:
      - "supabase/candidates/appstore_apple_authorization_vault.sql"
      - "supabase/tests/appstore_apple_vault_fixture.sql"
      - "supabase/tests/appstore_apple_signup_vault_combined_fixture.sql"
      - "supabase/candidates/appstore_apple_signup_vault_gate.sql"
      - ".github/workflows/appstore-apple-vault-fixture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoopcheck_apple_vault_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoopcheck_apple_vault_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hoopcheck_apple_vault_fixture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: dbdaf8f53ab61c6dee773d0b73d0c15fb8e7c050
          path: .compliance-reference
          persist-credentials: false
      - name: Rehearse encrypted authorization vault
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "hoopcheck_apple_vault_fixture"
          psql -X -Atqc 'SHOW server_version_num' | grep '^17'
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appstore_apple_vault_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appstore_apple_signup_vault_combined_fixture.sql
