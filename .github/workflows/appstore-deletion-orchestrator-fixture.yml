name: Account deletion orchestration fixture
on:
  pull_request:
    branches: ["integration/appstore-compliance-candidate"]
    paths:
      - "lib/server/account-deletion-orchestrator.ts"
      - "scripts/test-account-deletion-orchestrator.mjs"
      - ".github/workflows/appstore-deletion-orchestrator-fixture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test scripts/test-account-deletion-orchestrator.mjs
