name: Account deletion orchestration fixture
on:
  pull_request:
    branches: ["integration/appstore-compliance-candidate", "qa/hoopcheck-master-acceptance", "qa/step4-deletion-worker-tick-20261128"]
    paths:
      - "lib/server/apple-sign-in-authorization.ts"
      - "scripts/test-apple-sign-in-authorization.mjs"
      - "lib/server/account-deletion-orchestrator.ts"
      - "scripts/test-account-deletion-orchestrator.mjs"
      - "lib/server/personal-export-staging.ts"
      - "scripts/test-personal-export-staging.mjs"
      - "scripts/test-personal-export-artifacts.mjs"
      - "lib/server/personal-export-sources.ts"
      - "scripts/test-personal-export-sources.mjs"
      - "lib/server/account-deletion-private-rows.ts"
      - "scripts/test-account-deletion-private-rows.mjs"
      - "lib/server/account-deletion-cleanup.ts"
      - "scripts/test-account-deletion-cleanup.mjs"
      - "scripts/test-account-deletion-apple-integration.mjs"
      - ".github/workflows/appstore-deletion-orchestrator-fixture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test scripts/test-account-deletion-orchestrator.mjs scripts/test-account-deletion-cleanup.mjs scripts/test-account-deletion-apple-integration.mjs scripts/test-apple-sign-in-authorization.mjs scripts/test-personal-export-staging.mjs scripts/test-personal-export-artifacts.mjs scripts/test-personal-export-sources.mjs scripts/test-account-deletion-private-rows.mjs
