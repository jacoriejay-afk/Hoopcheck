name: App Store deletion request rehearsal (synthetic)
on:
  pull_request:
    branches: ["integration/appstore-compliance-candidate"]
    paths:
      - "supabase/candidates/appstore_deletion_request_only.sql"
      - "supabase/tests/appstore_deletion_request_fixture.sql"
      - "supabase/candidates/appstore_deletion_worker_state.sql"
      - "supabase/tests/appstore_deletion_worker_state_fixture.sql"
      - "supabase/candidates/appstore_deletion_apple_revocations.sql"
      - "supabase/tests/appstore_deletion_apple_revocations_fixture.sql"
      - "supabase/candidates/appstore_deletion_account_freeze.sql"
      - "supabase/tests/appstore_deletion_account_freeze_fixture.sql"
      - "supabase/migrations/20261106190000_add_account_deletion_requests.sql"
      - ".github/workflows/appstore-deletion-request-fixture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-deletion-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoopcheck_deletion_request_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoopcheck_deletion_request_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hoopcheck_deletion_request_fixture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 0b1bf9a67c52ae124b54c1c9d9f9f4117ce9ba67
          path: .compliance-apple
          persist-credentials: false
      - name: Verify local fixture database and run SQL
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "hoopcheck_deletion_request_fixture"
          psql -X -Atqc 'SHOW server_version_num' | grep '^17'
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appstore_deletion_request_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appstore_deletion_worker_state_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appstore_deletion_apple_revocations_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appstore_deletion_account_freeze_fixture.sql
          echo "Synthetic SQL only; no account deletion, hosted database or deployment."
