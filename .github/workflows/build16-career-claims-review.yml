name: Build 16 private career claims authorization
on:
  pull_request:
    paths:
      - 'supabase/candidates/build16_player_team_season_claims_review_only.sql'
      - 'supabase/candidates/build16_player_review_season_guard_review_only.sql'
      - 'supabase/tests/build16_player_team_season_claims.sql'
      - '.github/workflows/build16-career-claims-review.yml'
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/build16_player_team_season_claims.sql
