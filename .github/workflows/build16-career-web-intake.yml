name: Build 16 career web intake
on:
  pull_request:
    paths:
      - 'components/CareerClaimIntake.tsx'
      - 'app/career-history/**'
      - 'app/onboarding/teams/page.tsx'
      - 'app/account/page.tsx'
      - 'scripts/test-career-web-intake-contract.mjs'
      - '.github/workflows/build16-career-web-intake.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/test-career-web-intake-contract.mjs
