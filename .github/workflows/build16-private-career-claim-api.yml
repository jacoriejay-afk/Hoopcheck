name: Build 16 private career claim API
on:
  pull_request:
    paths:
      - 'app/api/career/claims/route.ts'
      - 'components/CareerClaimIntake.tsx'
      - 'lib/career/**'
      - 'scripts/test-private-career-claim-api.mjs'
      - '.github/workflows/build16-private-career-claim-api.yml'
permissions:
  contents: read
jobs:
  claim-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-private-career-claim-api.mjs
