name: HoopCheck CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      STRIPE_SECRET_KEY: ci-placeholder
      STRIPE_WEBHOOK_SECRET: ci-placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_PREMIUM_PRICE_ID: price_ci_premium
      NEXT_PUBLIC_SITE_URL: https://hoopcheck.online
      HOOPCHECK_THEME_TEST_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (informational)
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::Full audit reports unresolved advisories. Review the audit output; the production-only audit above remains blocking."
          fi

      - name: Audit hardcoded white surfaces (blocking)
        run: npm run audit:surfaces

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright and verify hosted Chrome
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright lighthouse@11.7.1
          google-chrome --version

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/hoopcheck-next.log 2>&1 &
          echo $! > /tmp/hoopcheck-next.pid

      - name: Verify canonical sitemap and robots host
        run: node scripts/domain-url-check.mjs

      - name: Verify PWA manifest, icons, service worker, and review cache policy
        run: node scripts/pwa-smoke-check.mjs

      - name: Run Lighthouse PWA audits
        run: |
          mkdir -p artifacts/pwa
          lighthouse http://127.0.0.1:3000 --only-categories=pwa --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=artifacts/pwa/lighthouse-pwa.json --quiet
          node -e 'const r=require("./artifacts/pwa/lighthouse-pwa.json"); const audits=r.audits; const names=["installable-manifest","service-worker","maskable-icon"]; const failed=names.filter(n=>!audits[n] || audits[n].score !== 1); for (const n of names) console.log(n + "=" + (audits[n] ? audits[n].score : "not-present")); if (failed.length) { console.error("Lighthouse PWA audit failures: " + failed.join(", ")); process.exit(1); }'

      - name: Upload PWA audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoopcheck-pwa-lighthouse
          path: artifacts/pwa/
          if-no-files-found: warn

      - name: Search repository for legacy domain references
        shell: bash
        run: |
          OLD_HOST="$(printf 'hoopcheck.%s' 'com')"
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=coverage "$OLD_HOST" .; then
            echo "DOMAIN_REFERENCE_SEARCH=FAIL"
            exit 1
          else
            echo "DOMAIN_REFERENCE_SEARCH=PASS"
            echo "DOMAIN_REFERENCE_MATCHES=0"
          fi

      - name: Verify computed theme styles and capture English screenshots
        env:
          THEME_TEST_LANGUAGE: en
        run: node scripts/theme-browser-check.mjs

      - name: Verify computed theme styles and capture Spanish screenshots
        env:
          THEME_TEST_LANGUAGE: es
        run: node scripts/theme-browser-check.mjs

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoopcheck-theme-screenshots
          path: artifacts/theme-check/**/*.png
          if-no-files-found: warn
