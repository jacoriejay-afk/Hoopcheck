name: HoopCheck CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoopcheck_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoopcheck_rls_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      STRIPE_SECRET_KEY: ci-placeholder
      STRIPE_WEBHOOK_SECRET: ci-placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_PREMIUM_PRICE_ID: price_ci_premium
      NEXT_PUBLIC_SITE_URL: https://hoopcheck.online
      HOOPCHECK_THEME_TEST_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Build 9 signed HTTP guard offline (no network or tokens)
        run: node scripts/build9-signed-http-acceptance.mjs --self-test

      - name: Verify production catalog guard offline (no database access)
        run: node scripts/check-build9-production-catalog-guard.mjs

      - name: Verify staged owner RPC, opt-in MFA and RLS in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          createdb -h 127.0.0.1 -U postgres hoopcheck_build8_owner_test
          node scripts/check-build8-owner-profile.mjs | psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_build8_owner_test

      - name: Verify staged HoopChat contact-request UPDATE privileges
        run: node scripts/check-hoopchat-contact-privileges.mjs


      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (blocking high severity)
        run: npm audit --audit-level=high

      - name: Audit hardcoded white surfaces (blocking)
        run: npm run audit:surfaces

      - name: Audit paired theme surfaces and contrast (blocking)
        run: npm run audit:theme-pairs
      - name: Execute isolated HoopFeed RLS policies with synthetic roles
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_rls_test -f supabase/tests/smoke_feed_rls_isolated.sql

      - name: Verify HoopFeed organization visibility and real totals
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres hoopcheck_organization_test
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_organization_test -f supabase/tests/hoopfeed_organization_isolated.sql

      - name: Verify player profile privacy with isolated synthetic roles
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres hoopcheck_profile_privacy_test
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_profile_privacy_test -f supabase/tests/player_profile_privacy.sql

      - name: Verify private profile columns and masked legacy discovery APIs
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres hoopcheck_private_fields_test
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_private_fields_test -f supabase/tests/profile_private_fields.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_private_fields_test -f supabase/tests/build9_legacy_projection_design.sql
          PGHOST=127.0.0.1 PGUSER=postgres node scripts/test-profile-private-sql-negative.mjs
          PGHOST=127.0.0.1 PGUSER=postgres node scripts/test-profile-compatibility-sql-negative.mjs
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_private_fields_test -f supabase/tests/build9_scoped_player_profile.sql

      - name: Verify optional MFA policies and privileged request enforcement
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres hoopcheck_mfa_test
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_mfa_test -f supabase/tests/opted_in_mfa.sql
          node --test scripts/test-mfa-enforcement.mjs
          PGHOST=127.0.0.1 PGUSER=postgres node scripts/test-mfa-sql-negative.mjs

      - name: Verify StoreKit ownership, membership sources, trials and refund isolation
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres hoopcheck_storekit_test
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_storekit_test -f supabase/tests/storekit_membership_isolated.sql
          node --test scripts/test-storekit-server.mjs
          node --test scripts/test-membership-reader.mjs
          node --test scripts/test-checkout-membership-policy.mjs

      - name: Rehearse committed synthetic purchase containment over a local socket
        run: |
          python3 scripts/rehearse-build9-compensation.py /tmp/build9-compensation.sql --synthetic --sql-root /repo
          docker exec ${{ job.services.postgres.id }} mkdir -p /repo
          docker cp supabase ${{ job.services.postgres.id }}:/repo/supabase
          docker cp scripts ${{ job.services.postgres.id }}:/repo/scripts
          docker cp /tmp/build9-compensation.sql ${{ job.services.postgres.id }}:/tmp/build9-compensation.sql
          docker exec ${{ job.services.postgres.id }} createdb -U postgres hoop_prod_rehearsal
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d hoop_prod_rehearsal -v ON_ERROR_STOP=1 -f /tmp/build9-compensation.sql
          docker exec ${{ job.services.postgres.id }} createdb -U postgres wrong_compensation_target
          if docker exec ${{ job.services.postgres.id }} psql -U postgres -d wrong_compensation_target -v ON_ERROR_STOP=1 -f /tmp/build9-compensation.sql > /tmp/build9-wrong-target.log 2>&1; then
            echo "Wrong-target compensation guard failed"
            exit 1
          fi
          grep -Fq 'Only the isolated socket rehearsal database is permitted' /tmp/build9-wrong-target.log
          test "$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d wrong_compensation_target -Atc "select count(*) from pg_tables where schemaname='public'")" = 0

      - name: Verify Ambassador HQ database security and commission lifecycle
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_rls_test -f supabase/tests/ambassador_hq_isolated.sql

      - name: Verify isolated Stripe trial reservation uniqueness
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres hoopcheck_trial_test
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_trial_test -f supabase/tests/stripe_trial_claims_isolated.sql

      - name: Prevent premature Stripe trial activation
        run: node scripts/check-stripe-trial-release-safety.mjs

      - name: Verify seven-day trial eligibility policy
        run: npm run test:stripe-trial

      - name: Verify all Stripe price tier and interval mappings
        run: |
          node --test scripts/test-stripe-price-mapping.mjs
          node --test scripts/test-checkout-membership-policy.mjs

      - name: Verify fail-closed Stripe trial recovery policy
        run: npm run test:stripe-trial-recovery

      - name: Verify Ambassador HQ Stripe invoice and adjustment handling
        run: node --test scripts/test-ambassador-stripe.mjs

      - name: Verify computed theme color arithmetic
        run: node --test scripts/test-theme-color-math.mjs

      - name: Verify Apple universal-link association contracts
        run: node --test scripts/test-apple-app-site-association.mjs

      - name: Verify native bootstrap authorization
        run: node --test scripts/test-mobile-bootstrap.mjs

      - name: Rehearse guarded legacy player privacy functions with synthetic PostgreSQL roles
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          node scripts/rehearse-legacy-player-privacy.mjs | psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_rls_test

      - name: Verify scoped Build8 owner profile RPC with opted-in MFA and RLS
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          createdb -h 127.0.0.1 -U postgres hoopcheck_build8_owner_test
          node scripts/check-build8-owner-profile.mjs | psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_build8_owner_test

      - name: Verify Build 8 public RPC compatibility under synthetic RLS roles
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          createdb -h 127.0.0.1 -U postgres hoopcheck_build8_compat_test
          node scripts/check-build8-readonly-compat.mjs | psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_build8_compat_test

      - name: Verify unified HoopFeed RLS migration safeguards
        run: npm run test:hoopfeed-rls

      - name: Verify caller-scoped HoopFeed actions
        run: node scripts/check-hoopfeed-vote-security.mjs

      - name: Check HoopFeed text posts and team fan group invariants
        run: npm run check:hf4-fan-groups

      - name: Inventory HoopFeed public media dependencies (read-only)
        run: node scripts/audit-hoopfeed-media-privacy.mjs

      - name: Verify private feed media authorization
        run: node --test scripts/check-private-feed-media.mjs

      - name: Check player profile completion
        run: node scripts/check-player-profile-completion.mjs

      - name: Check membership plan selection
        run: node --test scripts/check-membership-plans.cjs

      - name: Verify public business inquiry security invariants
        run: node --test scripts/check-public-business-inquiries.mjs

      - name: Verify all HoopFeed photos are moderated before upload
        run: node --test scripts/check-hoopfeed-moderation.mjs

      - name: Check rounded-corner design tokens
        run: npm run check:rounded-corners

      - name: Verify read-only NBA validation authorization and error handling
        run: node --test scripts/test-balldontlie-validation.mjs

      - name: Verify licensed logo matches are explicitly reviewed
        run: node --test scripts/test-team-logo-review-policy.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright and verify hosted Chrome
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright
          google-chrome --version

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/hoopcheck-next.log 2>&1 &
          echo $! > /tmp/hoopcheck-next.pid

      - name: Verify men’s and women’s team discovery
        run: node scripts/check-team-discovery-browser.mjs

      - name: Verify November audit UI regression contracts
        run: node scripts/check-audit-ui-contracts.mjs

      - name: Verify profile editing and team review checklist
        run: node scripts/check-profile-editor-browser.mjs

      - name: Verify player profile completion
        run: node scripts/check-player-completion-browser.mjs

      - name: Verify membership providers, role offers and billing recovery
        run: node scripts/check-membership-provider-browser.cjs

      - name: Verify canonical sitemap and robots host
        run: node scripts/domain-url-check.mjs

      - name: Search repository for legacy domain references
        shell: bash
        run: |
          OLD_HOST="$(printf 'hoopcheck.%s' 'com')"
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=coverage "$OLD_HOST" .; then
            echo "DOMAIN_REFERENCE_SEARCH=FAIL"
            exit 1
          else
            echo "DOMAIN_REFERENCE_SEARCH=PASS"
            echo "DOMAIN_REFERENCE_MATCHES=0"
          fi

      - name: Verify computed theme styles and capture English screenshots
        env:
          THEME_TEST_LANGUAGE: en
        run: node scripts/theme-browser-check.mjs

      - name: Verify computed theme styles and capture Spanish screenshots
        env:
          THEME_TEST_LANGUAGE: es
        run: node scripts/theme-browser-check.mjs

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoopcheck-theme-screenshots
          path: artifacts/theme-check/**/*.png
          if-no-files-found: warn
