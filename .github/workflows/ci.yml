name: HoopCheck CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      STRIPE_SECRET_KEY: ci-placeholder
      STRIPE_WEBHOOK_SECRET: ci-placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_PREMIUM_PRICE_ID: price_ci_premium
      NEXT_PUBLIC_SITE_URL: https://hoopcheck.online
      HOOPCHECK_THEME_TEST_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (informational)
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::Full audit reports unresolved advisories. Review the audit output; the production-only audit above remains blocking."
          fi

      - name: Audit hardcoded white surfaces (blocking)
        run: npm run audit:surfaces

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright and verify hosted Chrome
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright
          google-chrome --version

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/hoopcheck-next.log 2>&1 &
          echo $! > /tmp/hoopcheck-next.pid

      - name: Verify canonical sitemap and robots host
        run: node scripts/domain-url-check.mjs

      - name: Search repository for legacy domain references
        shell: bash
        run: |
          OLD_HOST="$(printf 'hoopcheck.%s' 'com')"
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=coverage "$OLD_HOST" .; then
            echo "DOMAIN_REFERENCE_SEARCH=FAIL"
            exit 1
          else
            echo "DOMAIN_REFERENCE_SEARCH=PASS"
            echo "DOMAIN_REFERENCE_MATCHES=0"
          fi

      - name: Verify computed theme styles and capture English screenshots
        env:
          THEME_TEST_LANGUAGE: en
        run: node scripts/theme-browser-check.mjs

      - name: Verify computed theme styles and capture Spanish screenshots
        env:
          THEME_TEST_LANGUAGE: es
        run: node scripts/theme-browser-check.mjs

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoopcheck-theme-screenshots
          path: artifacts/theme-check/**/*.png
          if-no-files-found: warn

  performance:
    name: ${{ matrix.variant }} mobile performance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: ${{ github.event.pull_request.base.sha }}
          - variant: candidate
            ref: ${{ github.event.pull_request.head.sha }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      STRIPE_SECRET_KEY: ci-placeholder
      STRIPE_WEBHOOK_SECRET: ci-placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_PREMIUM_PRICE_ID: price_ci_premium
      NEXT_PUBLIC_SITE_URL: https://hoopcheck.online
      HOOPCHECK_THEME_TEST_MODE: "true"
    steps:
      - name: Checkout measured revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and capture route bundle sizes
        run: |
          set -o pipefail
          mkdir -p artifacts/performance artifacts/lighthouse
          npm run build 2>&1 | tee artifacts/performance/next-build.log
          node scripts/measure-route-bundles.mjs | tee artifacts/performance/route-bundles.txt

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/hoopcheck-next.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then
              echo "PRODUCTION_SERVER_READY=true"
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/ >/dev/null || { cat /tmp/hoopcheck-next.log; exit 1; }

      - name: Run three mobile Lighthouse passes per route
        run: |
          cat > /tmp/lighthouserc.json <<'JSON'
          {
            "ci": {
              "collect": {
                "url": [
                  "http://127.0.0.1:3000/",
                  "http://127.0.0.1:3000/search",
                  "http://127.0.0.1:3000/teams/b79a5635-4531-4cc9-981d-103f9b61b9c2"
                ],
                "numberOfRuns": 3,
                "settings": {
                  "emulatedFormFactor": "mobile",
                  "throttlingMethod": "simulate",
                  "chromeFlags": "--no-sandbox --headless"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.9}],
                  "largest-contentful-paint": ["warn", {"maxNumericValue": 2500}],
                  "cumulative-layout-shift": ["warn", {"maxNumericValue": 0.1}]
                }
              },
              "upload": {
                "target": "filesystem",
                "outputDir": "artifacts/lighthouse"
              }
            }
          }
          JSON
          npx --yes @lhci/cli@0.15.1 autorun --config=/tmp/lighthouserc.json

      - name: Upload performance comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoopcheck-performance-${{ matrix.variant }}
          path: |
            artifacts/performance/**
            artifacts/lighthouse/**
          if-no-files-found: warn
