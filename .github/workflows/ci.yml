name: HoopCheck CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      STRIPE_SECRET_KEY: ci-placeholder
      STRIPE_WEBHOOK_SECRET: ci-placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_PREMIUM_PRICE_ID: price_ci_premium
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
      HOOPCHECK_THEME_TEST_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (informational)
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::Full audit reports unresolved advisories. Review the audit output; the production-only audit above remains blocking."
          fi

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright and verify hosted Chrome
        run: |
          npm install --no-save --package-lock=false playwright
          google-chrome --version

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/hoopcheck-next.log 2>&1 &
          echo $! > /tmp/hoopcheck-next.pid

      - name: Verify computed theme styles and capture screenshots
        run: node scripts/theme-browser-check.mjs

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoopcheck-theme-screenshots
          path: artifacts/theme-check/*.png
          if-no-files-found: warn
