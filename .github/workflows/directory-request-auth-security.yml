name: Directory request approval security
on:
  pull_request:
    paths:
      - 'supabase/migrations/*admin_only_directory_request_approval.sql'
      - 'supabase/tests/directory_request_auth_security.sql'
      - '.github/workflows/directory-request-auth-security.yml'
  workflow_dispatch:
jobs:
  authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/directory_request_auth_security.sql
