name: HOOPDATA Sync Retention Rehearsal
on:
  pull_request:
    paths:
      - 'supabase/candidates/hoopdata_*.sql'
      - 'supabase/tests/hoopdata_*isolated.sql'
      - 'app/api/cron/hoopdata-competition-refresh-preview/route.ts'
      - '.github/workflows/hoopdata-sync-retention-review.yml'
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoopcheck_hoopdata_budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoopcheck_hoopdata_budget_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Rehearse retention and fencing in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_hoopdata_budget_test -f supabase/tests/hoopdata_provider_budget_isolated.sql -f supabase/tests/hoopdata_sync_retention_isolated.sql
