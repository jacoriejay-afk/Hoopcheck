name: HoopGroups private access synthetic fixture
on:
  pull_request:
    paths:
      - 'supabase/candidates/hoopgroups_private_access_review_only.sql'
      - 'supabase/tests/hoopgroups_private_access_isolated.sql'
      - 'supabase/candidates/hoopgroups_member_page_review_only.sql'
      - 'supabase/tests/hoopgroups_member_page_isolated.sql'
      - '.github/workflows/hoopgroups-private-access-fixture.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated synthetic fixture only
        env:
          PGPASSWORD: fixture
        run: psql -X -h 127.0.0.1 -U postgres -d fixture -v ON_ERROR_STOP=1 -f supabase/tests/hoopgroups_private_access_isolated.sql
