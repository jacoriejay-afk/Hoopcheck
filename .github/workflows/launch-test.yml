name: HoopCheck Launch Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
