name: HoopCheck Launch Test (Final Gate)
on:
  push:
    branches: [main, "integration/build9-backend-completion-20261121"]
  pull_request:
    branches: [main, "fix/build9-iphone-repairs", "integration/build9-backend-completion-20261121"]
  workflow_dispatch:
jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

# Final player-profile launch gate
