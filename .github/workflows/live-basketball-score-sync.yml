name: Sync live basketball scores

on:
  workflow_dispatch:
  schedule:
    # Four runs per hour = 96 scheduled API calls per day, leaving four calls
    # of headroom under the free tier's 100-request daily limit.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: live-basketball-score-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Trigger secured live-score sync endpoint
        env:
          LIVE_SCORES_SYNC_URL: https://hoopcheck-nine.vercel.app/api/cron/live-basketball
          LIVE_SCORES_CRON_SECRET: ${{ secrets.LIVE_SCORES_CRON_SECRET }}
        run: |
          set -eu
          if [ -z "$LIVE_SCORES_SYNC_URL" ] || [ -z "$LIVE_SCORES_CRON_SECRET" ]; then
            echo "Configure LIVE_SCORES_CRON_SECRET in GitHub Actions secrets."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $LIVE_SCORES_CRON_SECRET" \
            "$LIVE_SCORES_SYNC_URL"
