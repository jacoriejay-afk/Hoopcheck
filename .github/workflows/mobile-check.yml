name: Mobile App Checks

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "lib/auth/**"
      - "lib/billing/**"
      - "lib/membership-tier.ts"
  push:
    branches:
      - "feat/expo-mobile-foundation"
      - "fix/expo-doctor-dependencies"
    paths:
      - "apps/mobile/**"
      - "lib/auth/**"
      - "lib/billing/**"
      - "lib/membership-tier.ts"
      - ".github/workflows/mobile-check.yml"

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: npm ci
      - name: Verify vendored dependency provenance and current audit
        run: |
          node scripts/verify-dependency-provenance.mjs --upstream
          npm audit --json > /tmp/mobile-audit.json
          npm audit --omit=dev --json > /tmp/mobile-production-audit.json
          node -e 'const a = require("/tmp/mobile-audit.json"); for (const n of ["decode-uri-component", "image-size", "query-string"]) if (a.vulnerabilities[n]) throw new Error(n + " advisory regression");'
      - name: Native link and telemetry privacy contracts
        run: npm run test:native
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Test native Supabase URL validation
        run: node --test scripts/test-supabase-url.mjs
      - name: Test native sign-in and callback integration
        run: node --test scripts/test-auth-integration.mjs
      - name: Expo dependency and configuration diagnostics
        run: npx expo-doctor

      - name: Verify generated iOS permissions locally (no compilation or signing)
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          npx --no-install expo prebuild --platform ios --no-install
          python3 scripts/verify-ios-permissions.py

      - name: Export native iOS bundle locally (no EAS build)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
          EXPO_PUBLIC_HOOPCHECK_API_URL: https://api.test
          EXPO_NO_TELEMETRY: "1"
        run: npx --no-install expo export --platform ios --clear --max-workers 2 --output-dir /tmp/hoopcheck-mobile-ios

      - name: Export Android Hermes bundle locally
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
          EXPO_PUBLIC_HOOPCHECK_API_URL: https://api.test
          EXPO_NO_TELEMETRY: "1"
        run: npx --no-install expo export --platform android --clear --max-workers 2 --output-dir /tmp/hoopcheck-mobile-android

      - name: Export isolated native browser fixture
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
          EXPO_PUBLIC_HOOPCHECK_API_URL: https://api.test
          EXPO_NO_TELEMETRY: "1"
        run: npx --no-install expo export --platform web --clear --max-workers 2 --output-dir /tmp/hoopcheck-mobile-web

      - name: Start localhost fixture server
        run: python3 scripts/serve-native-fixture.py /tmp/hoopcheck-mobile-web 8092 > /tmp/hoopcheck-native-browser.log 2>&1 &

      - name: Verify native community, permissions and navigation in both themes
        env:
          NATIVE_TEST_URL: http://127.0.0.1:8092
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node scripts/verify-membership-browser.cjs
          node scripts/verify-mfa-browser.cjs
          node scripts/verify-player-profiles-browser.cjs
          node scripts/verify-media-browser.cjs
          node scripts/verify-profile-editor-browser.cjs
          node scripts/verify-club-groups-browser.cjs
          node scripts/verify-live-games-browser.cjs
          node scripts/verify-feed-browser.cjs
          node scripts/verify-discovery-browser.cjs
          node scripts/verify-theme-preference-browser.cjs
          node scripts/verify-design-browser.cjs

      - name: Upload native browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-regressions
          path: /tmp/hoopcheck-native-ui/*.png
          if-no-files-found: warn
