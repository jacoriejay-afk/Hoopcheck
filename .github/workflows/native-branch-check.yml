name: Native shell branch checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.*"
      - ".github/workflows/native-branch-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-branch-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, test, lint, and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test canonical native URLs
        run: npm run test:native-links

      - name: Run ESLint
        run: npm run lint

      - name: Type-check TypeScript
        run: npx tsc --noEmit
