name: Resolve native CAPTCHA WebView dependency (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/resolve-native-captcha-webview.yml'
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'security/build16-native-captcha-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Expo SDK-matched WebView
        run: |
          CI=1 npx expo install react-native-webview --npm
          npx expo install --check
      - name: Emit generated manifest and lockfile patch
        run: |
          git diff -- package.json package-lock.json
          node -e 'const lock=require("./package-lock.json");const p=require("./package.json");console.log("WEBVIEW_RESOLUTION="+JSON.stringify({dependency:p.dependencies["react-native-webview"],entries:Object.fromEntries(Object.entries(lock.packages).filter(([k])=>k.includes("react-native-webview")))}))'
      - uses: actions/upload-artifact@v4
        with:
          name: native-captcha-generated-lock
          path: |
            apps/mobile/package.json
            apps/mobile/package-lock.json
          retention-days: 1
