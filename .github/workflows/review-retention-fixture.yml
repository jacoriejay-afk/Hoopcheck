name: Review retention synthetic fixture
on:
  pull_request:
    branches: ["qa/hoopcheck-master-acceptance"]
    paths:
      - 'supabase/candidates/appstore_deletion_review_retention_review_only.sql'
      - 'supabase/tests/appstore_deletion_review_retention_fixture.sql'
      - '.github/workflows/review-retention-fixture.yml'
      - 'lib/server/review-trust-verification.ts'
      - 'scripts/test-review-trust-verification.mjs'
      - 'app/api/trust-score/route.ts'
      - 'app/api/admin/reviews/[reviewId]/route.ts'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: hoopcheck_review_retention_fixture
        options: >-
          --health-cmd "pg_isready -U postgres -d hoopcheck_review_retention_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run isolated review retention fixture
        env:
          FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$FIXTURE_CONTAINER" mkdir -p /tmp/review-fixture/candidates /tmp/review-fixture/tests
          docker cp supabase/candidates/appstore_deletion_review_retention_review_only.sql "$FIXTURE_CONTAINER:/tmp/review-fixture/candidates/"
          docker cp supabase/tests/appstore_deletion_review_retention_fixture.sql "$FIXTURE_CONTAINER:/tmp/review-fixture/tests/"
          docker exec "$FIXTURE_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d hoopcheck_review_retention_fixture -f /tmp/review-fixture/tests/appstore_deletion_review_retention_fixture.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run retained review trust adapter regressions
        run: node --experimental-strip-types --test scripts/test-review-trust-verification.mjs
