name: Private scouting notes authorization rehearsal
on:
  pull_request:
    paths:
      - 'supabase/candidates/build16_private_scouting_notes_review_only.sql'
      - 'supabase/tests/build16_private_scouting_notes_isolated.sql'
      - '.github/workflows/scouting-notes-review.yml'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoopcheck_scouting_notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoopcheck_scouting_notes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test private notes with isolated roles
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hoopcheck_scouting_notes_test -f supabase/tests/build16_private_scouting_notes_isolated.sql
