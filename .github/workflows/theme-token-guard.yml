name: Theme token guard

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  theme-token-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject newly added hardcoded surface colors
        run: node scripts/check-theme-tokens.mjs
