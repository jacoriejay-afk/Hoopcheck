name: VERIFY-1 entitlement matrix

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/membership-tier.ts"
      - "app/**"
      - "components/**"
      - "scripts/test-membership-tier.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-1-entitlements.yml"
  workflow_dispatch:

jobs:
  entitlement-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run role and tier entitlement matrix
        run: npm run test:entitlements
