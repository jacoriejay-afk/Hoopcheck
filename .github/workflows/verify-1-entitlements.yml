name: VERIFY-1 entitlement matrix

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/membership-tier.ts"
      - "lib/game-availability.ts"
      - "supabase/migrations/20261111200000_live_chat_room_lifecycle.sql"
      - "supabase/tests/live_chat_lifecycle.sql"
      - "app/**"
      - "components/**"
      - "scripts/test-membership-tier.mjs"
      - "scripts/test-game-availability.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-1-entitlements.yml"
  workflow_dispatch:

jobs:
  entitlement-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run role and tier entitlement matrix
        run: npm run test:entitlements
      - name: Run game chat lifecycle regression tests
        run: npm run test:game-availability

  live-chat-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoopcheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run isolated SQL migration and RLS cases
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d hoopcheck_test -f supabase/tests/live_chat_lifecycle.sql
