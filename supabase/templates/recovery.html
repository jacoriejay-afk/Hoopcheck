<h2>Reset your HoopCheck™ password</h2>
<p>Use the link below to choose a new password for your HoopCheck account.</p>
{{ if .RedirectTo }}
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>
{{ else }}
<p><a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>
{{ end }}
<p>If you did not request a password reset, you can ignore this email.</p>
